<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日中当番担当割り振りアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            200: '#bcccdc',
                            300: '#9fb3c8',
                            400: '#829ab1',
                            500: '#627d98',
                            600: '#486581',
                            700: '#334e68',
                            800: '#243b53',
                            900: '#102a43',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'Hiragino Sans', 'Meiryo', sans-serif; background-color: #f0f4f8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="text"], input[type="number"], select { font-size: 0.875rem; }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <header class="bg-navy-900 text-white shadow-md z-10 relative">
        <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user-doctor text-2xl text-blue-300"></i>
                <h1 class="text-xl font-bold tracking-wider">日中当番担当割り振りアプリ</h1>
            </div>
            <div class="text-sm text-navy-200 hidden sm:block">
                <i class="fa-solid fa-shield-halved mr-1"></i> 詳細条件対応・自動編成エンジン搭載
            </div>
        </div>
    </header>

    <main class="flex-grow overflow-auto p-4 sm:p-6 lg:p-8">
        <div class="max-w-screen-2xl mx-auto grid grid-cols-1 xl:grid-cols-4 gap-6">
            
            <!-- Left Column: Settings and Members -->
            <div class="xl:col-span-3 space-y-6">
                
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-navy-800 px-5 py-3 text-white">
                        <h2 class="font-semibold"><i class="fa-solid fa-sliders mr-2"></i>基本設定</h2>
                    </div>
                    <div class="p-5 grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">対象年月</label>
                            <input type="month" id="targetMonth" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-navy-500 focus:border-navy-500 border p-2 bg-gray-50">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">休診日・祝日（除外する日付）</label>
                            <input type="text" id="holidays" placeholder="例: 11, 12 (カンマ区切り)" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-navy-500 focus:border-navy-500 border p-2 bg-gray-50">
                            <p class="text-xs text-gray-500 mt-1">※土日は自動的に除外されます。</p>
                        </div>
                    </div>
                </section>

                <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-navy-800 px-5 py-3 text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <h2 class="font-semibold"><i class="fa-solid fa-users-gear mr-2"></i>対象者と除外条件（日付をカンマ区切りで入力）</h2>
                        <div class="flex gap-2">
                            <button onclick="exportCSV()" class="bg-green-600 hover:bg-green-500 text-white text-xs py-1.5 px-3 rounded shadow transition flex items-center" title="Excel用CSVファイルとして出力">
                                <i class="fa-solid fa-file-excel mr-1"></i>表を出力
                            </button>
                            <button onclick="document.getElementById('csvFileInput').click()" class="bg-yellow-600 hover:bg-yellow-500 text-white text-xs py-1.5 px-3 rounded shadow transition flex items-center" title="Excel用CSVファイルを読み込み">
                                <i class="fa-solid fa-upload mr-1"></i>表を読込
                            </button>
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(event)">
                            <button onclick="addMember()" class="bg-navy-600 hover:bg-navy-500 text-white text-xs py-1.5 px-3 rounded shadow transition flex items-center">
                                <i class="fa-solid fa-user-plus mr-1"></i>人員追加
                            </button>
                        </div>
                    </div>
                    
                    <div class="bg-blue-50 p-3 text-xs text-navy-800 border-b border-blue-100 flex flex-wrap gap-4">
                        <div><strong class="text-navy-900 font-bold">当直:</strong> 当日と翌日を除外</div>
                        <div><strong class="text-navy-900 font-bold">消化器当番:</strong> 翌日を除外</div>
                        <div><strong class="text-navy-900 font-bold">外勤/休暇:</strong> 当日を除外</div>
                        <div><strong class="text-navy-900 font-bold">新患:</strong> 1stを除外（2ndは極力回避）</div>
                    </div>

                    <div class="p-0 overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase w-28">名前</th>
                                    <th class="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase w-36">属性</th>
                                    <th class="px-2 py-2 text-center text-xs font-medium text-gray-500 uppercase w-16" title="1st Callの最大担当日数">1st上限</th>
                                    <th class="px-2 py-2 text-center text-xs font-medium text-gray-500 uppercase w-16" title="2nd Callの最大担当日数">2nd上限</th>
                                    <th class="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase">当直</th>
                                    <th class="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase">消化器当番</th>
                                    <th class="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase">外勤・休暇</th>
                                    <th class="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase">新患</th>
                                    <th class="px-2 py-2 text-center text-xs font-medium text-gray-500 uppercase w-12">操作</th>
                                </tr>
                            </thead>
                            <tbody id="membersTable" class="bg-white divide-y divide-gray-200">
                                <!-- Rows will be rendered here via JS -->
                            </tbody>
                        </table>
                    </div>
                    <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end items-center gap-4">
                        <span id="loadingIndicator" class="hidden text-navy-600 text-sm font-medium">
                            <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> 最適なスケジュールを計算中...
                        </span>
                        <button onclick="startGeneration()" class="bg-navy-700 hover:bg-navy-800 text-white font-bold py-2 px-6 rounded shadow-md flex items-center transition duration-150 ease-in-out transform hover:scale-105 active:scale-95">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>スケジュール自動生成
                        </button>
                    </div>
                </section>
                
                <div id="alertBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative shadow-sm" role="alert">
                    <span class="block sm:inline" id="alertMessage"></span>
                </div>
            </div>

            <!-- Right Column: Results -->
            <div class="xl:col-span-1 space-y-6">
                <!-- Results Section -->
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col" style="max-height: 60vh;">
                    <div class="bg-navy-900 px-5 py-3 text-white flex justify-between items-center">
                        <h2 class="font-semibold"><i class="fa-solid fa-calendar-days mr-2"></i>生成結果</h2>
                        <button onclick="copyToClipboard()" class="text-navy-200 hover:text-white transition focus:outline-none" title="クリップボードにコピー">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>
                    <div class="bg-orange-50 p-2 text-xs text-orange-800 border-b border-orange-100 flex items-center gap-2">
                        <i class="fa-solid fa-triangle-exclamation text-orange-500"></i>
                        <span>新患担当日の2nd Call割り当てを示します</span>
                    </div>
                    <div class="p-0 flex-grow overflow-y-auto hide-scrollbar">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase w-16">日付</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase w-1/2">1st Call</th>
                                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase w-1/2">2nd Call</th>
                                </tr>
                            </thead>
                            <tbody id="resultTable" class="bg-white divide-y divide-gray-200 text-sm">
                                <tr>
                                    <td colspan="3" class="px-4 py-12 text-center text-gray-400">
                                        <i class="fa-solid fa-list-check text-4xl mb-3 opacity-50"></i>
                                        <p>条件を設定し、「スケジュール自動生成」<br>をクリックしてください。</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                
                <!-- Summary Section -->
                <div id="summaryContainer"></div>
            </div>
        </div>
    </main>

    <script>
        // Role mappings for UI and Logic
        const roleMapToJa = { 'pgy1': '専攻医1年目', 'pgy23': '専攻医2・3年目', 'staff': '教員・スタッフ' };
        const jaToRoleMap = { '専攻医1年目': 'pgy1', '専攻医2・3年目': 'pgy23', '教員・スタッフ': 'staff' };

        // Priority Weights (Lower number = Higher priority)
        const roleWeight1st = { 'pgy1': 1, 'pgy23': 2, 'staff': 3 };
        const roleWeight2nd = { 'staff': 1, 'pgy23': 2, 'pgy1': 3 };

        // Initial state with roles added
        let members = [
            { id: 1, name: "瓜田宗", role: "pgy1", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "18", shoukaki: "", fuzai: "", shinkan: "6,13,20,27" },
            { id: 2, name: "瓜田愛", role: "pgy1", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "", shoukaki: "", fuzai: "", shinkan: "5,12,19,26" },
            { id: 3, name: "竹本", role: "pgy23", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "19", shoukaki: "", fuzai: "", shinkan: "6,13,27" },
            { id: 4, name: "木内", role: "pgy23", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "6", shoukaki: "2,24", fuzai: "4,5", shinkan: "14,21,28" },
            { id: 5, name: "田島", role: "staff", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "27", shoukaki: "25", fuzai: "", shinkan: "4,18,25" },
            { id: 6, name: "巽", role: "staff", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "", shoukaki: "6,16", fuzai: "14,21", shinkan: "7,10,24,31" },
            { id: 7, name: "齋藤", role: "staff", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "30", shoukaki: "23", fuzai: "7", shinkan: "3,17" },
            { id: 8, name: "八子", role: "pgy1", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "", shoukaki: "18,26", fuzai: "28", shinkan: "4" },
            { id: 9, name: "山田", role: "pgy23", maxFirstShifts: 3, maxSecondShifts: 3, douchoku: "", shoukaki: "3,20", fuzai: "14", shinkan: "20" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Setup default inputs (August 2026, Holiday 11th)
            document.getElementById('targetMonth').value = '2026-08';
            document.getElementById('holidays').value = '11';
            renderMembers();
        });

        function generateId() {
            return members.length > 0 ? Math.max(...members.map(m => m.id)) + 1 : 1;
        }

        function renderMembers() {
            const tbody = document.getElementById('membersTable');
            tbody.innerHTML = '';
            
            members.forEach((member) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-50/50 transition-colors duration-150";
                tr.innerHTML = `
                    <td class="px-2 py-2">
                        <input type="text" class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.name}" onchange="updateMember(${member.id}, 'name', this.value)">
                    </td>
                    <td class="px-2 py-2">
                        <select class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-xs text-gray-700 bg-white" onchange="updateMember(${member.id}, 'role', this.value)">
                            <option value="pgy1" ${member.role === 'pgy1' ? 'selected' : ''}>専攻医1年目</option>
                            <option value="pgy23" ${member.role === 'pgy23' ? 'selected' : ''}>専攻医2・3年目</option>
                            <option value="staff" ${member.role === 'staff' ? 'selected' : ''}>教員・スタッフ</option>
                        </select>
                    </td>
                    <td class="px-2 py-2">
                        <input type="number" min="0" class="w-full text-center border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.maxFirstShifts}" onchange="updateMember(${member.id}, 'maxFirstShifts', this.value)">
                    </td>
                    <td class="px-2 py-2">
                        <input type="number" min="0" class="w-full text-center border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.maxSecondShifts}" onchange="updateMember(${member.id}, 'maxSecondShifts', this.value)">
                    </td>
                    <td class="px-2 py-2">
                        <input type="text" class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.douchoku}" onchange="updateMember(${member.id}, 'douchoku', this.value)" placeholder="例: 1,2">
                    </td>
                    <td class="px-2 py-2">
                        <input type="text" class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.shoukaki}" onchange="updateMember(${member.id}, 'shoukaki', this.value)">
                    </td>
                    <td class="px-2 py-2">
                        <input type="text" class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.fuzai}" onchange="updateMember(${member.id}, 'fuzai', this.value)">
                    </td>
                    <td class="px-2 py-2">
                        <input type="text" class="w-full border-gray-300 rounded shadow-sm focus:border-navy-500 focus:ring focus:ring-navy-200 focus:ring-opacity-50 border p-1.5 transition-shadow text-sm" value="${member.shinkan}" onchange="updateMember(${member.id}, 'shinkan', this.value)">
                    </td>
                    <td class="px-2 py-2 text-center">
                        <button onclick="removeMember(${member.id})" class="text-red-400 hover:text-red-600 transition-colors p-1 rounded hover:bg-red-50" title="削除">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addMember() {
            members.push({
                id: generateId(),
                name: `新規担当者`,
                role: "pgy1", // Default role
                maxFirstShifts: 3, maxSecondShifts: 3,
                douchoku: "", shoukaki: "", fuzai: "", shinkan: ""
            });
            renderMembers();
        }

        function removeMember(id) {
            members = members.filter(m => m.id !== id);
            renderMembers();
        }

        function updateMember(id, field, value) {
            const member = members.find(m => m.id === id);
            if (member) {
                if(field === 'maxFirstShifts' || field === 'maxSecondShifts') {
                    member[field] = parseInt(value) || 0;
                } else {
                    member[field] = value;
                }
            }
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alertBox');
            document.getElementById('alertMessage').innerText = msg;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 5000);
        }

        // --- CSV Export / Import Functions ---
        function exportCSV() {
            const header = ["名前", "属性", "1st上限", "2nd上限", "当直", "消化器当番", "外勤・休暇", "新患"];
            const rows = members.map(m => [
                `"${m.name || ''}"`, 
                `"${roleMapToJa[m.role] || ''}"`, 
                m.maxFirstShifts, 
                m.maxSecondShifts,
                `"${m.douchoku || ''}"`, 
                `"${m.shoukaki || ''}"`, 
                `"${m.fuzai || ''}"`, 
                `"${m.shinkan || ''}"`
            ]);
            
            const csvContent = header.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
            
            // Add BOM for Excel UTF-8 compatibility
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
            
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "当番割り振り条件.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
                if(lines.length <= 1) {
                    showAlert("データが見つからないか、無効なファイル形式です。");
                    return;
                }

                const parseCSVRow = (str) => {
                    let result = [], cur = "", inQuotes = false;
                    for (let i = 0; i < str.length; i++) {
                        if (str[i] === '"') inQuotes = !inQuotes;
                        else if (str[i] === ',' && !inQuotes) { result.push(cur.trim()); cur = ""; }
                        else cur += str[i];
                    }
                    result.push(cur.trim());
                    return result;
                };

                const newMembers = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVRow(lines[i]);
                    if(cols.length >= 8) {
                        const roleJa = cols[1];
                        const mappedRole = jaToRoleMap[roleJa] || 'pgy1'; // fallback

                        newMembers.push({
                            id: i,
                            name: cols[0],
                            role: mappedRole,
                            maxFirstShifts: parseInt(cols[2]) || 0,
                            maxSecondShifts: parseInt(cols[3]) || 0,
                            douchoku: cols[4],
                            shoukaki: cols[5],
                            fuzai: cols[6],
                            shinkan: cols[7]
                        });
                    }
                }
                
                if(newMembers.length > 0) {
                    members = newMembers;
                    renderMembers();
                    showAlert("表データを読み込みました！");
                }
                document.getElementById('csvFileInput').value = "";
            };
            reader.readAsText(file); 
        }
        // -------------------------------------

        function parseDates(dateStr) {
            if (!dateStr) return [];
            return dateStr.split(',')
                .map(d => parseInt(d.replace(/[^0-9]/g, '')))
                .filter(d => !isNaN(d));
        }

        function getValidDays(year, month, holidays) {
            const daysInMonth = new Date(year, month, 0).getDate();
            const validDays = [];
            const dayNames = ['日', '月', '火', '水', '木', '金', '土'];

            for (let i = 1; i <= daysInMonth; i++) {
                const date = new Date(year, month - 1, i);
                const dayOfWeek = date.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !holidays.includes(i)) {
                    validDays.push({ date: i, dayName: dayNames[dayOfWeek] });
                }
            }
            return validDays;
        }

        function startGeneration() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            setTimeout(() => {
                generateSchedule();
                document.getElementById('loadingIndicator').classList.add('hidden');
            }, 50);
        }

        function generateSchedule() {
            const monthVal = document.getElementById('targetMonth').value;
            if (!monthVal) { showAlert("対象年月を選択してください。"); return; }
            
            const [year, month] = monthVal.split('-').map(Number);
            const holidays = parseDates(document.getElementById('holidays').value);
            const validDays = getValidDays(year, month, holidays);
            
            if(members.length === 0) { showAlert("対象者がいません。"); return; }

            const parsedMembers = members.map(m => {
                const douchoku = parseDates(m.douchoku);
                const shoukaki = parseDates(m.shoukaki);
                const fuzai = parseDates(m.fuzai);
                const shinkan = parseDates(m.shinkan);

                let absoluteExclusions = new Set([...fuzai, ...douchoku]);
                douchoku.forEach(d => absoluteExclusions.add(d + 1)); // 当直翌日除外
                shoukaki.forEach(d => absoluteExclusions.add(d + 1)); // 消化器翌日除外

                return {
                    ...m,
                    absoluteExclusions,
                    shinkanExclusions: new Set(shinkan)
                };
            });

            let bestSchedule = null;
            let bestScore = -Infinity;
            const ITERATIONS = 15000;

            for (let i = 0; i < ITERATIONS; i++) {
                let currentSchedule = [];
                let counts = {};
                parsedMembers.forEach(m => counts[m.id] = { first: 0, second: 0, total: 0 });
                
                let iterationScore = 0;

                for (let day of validDays) {
                    const date = day.date;
                    
                    // --- Assign 1st Call ---
                    let avail1st = parsedMembers.filter(m => 
                        !m.absoluteExclusions.has(date) && 
                        !m.shinkanExclusions.has(date) && 
                        counts[m.id].first < m.maxFirstShifts
                    );

                    // 1st Call Priority Logic
                    avail1st.sort((a, b) => {
                        // 1. Role priority (pgy1 > pgy23 > staff)
                        const weightDiff = roleWeight1st[a.role] - roleWeight1st[b.role];
                        if (weightDiff !== 0) return weightDiff;
                        
                        // 2. Equalize shifts within the same role
                        const countDiff = counts[a.id].first - counts[b.id].first;
                        if (countDiff !== 0) return countDiff;
                        
                        // 3. Randomize if tie
                        return Math.random() - 0.5;
                    });
                    
                    let firstCall = avail1st.length > 0 ? avail1st[0] : null;
                    if (firstCall) {
                        counts[firstCall.id].first++;
                        counts[firstCall.id].total++;
                    } else {
                        iterationScore -= 100000; // Penalize heavy if unassigned
                    }

                    // --- Assign 2nd Call ---
                    let avail2nd = parsedMembers.filter(m => 
                        !m.absoluteExclusions.has(date) && 
                        counts[m.id].second < m.maxSecondShifts &&
                        (!firstCall || m.id !== firstCall.id) 
                    );

                    // 2nd Call Priority Logic
                    avail2nd.sort((a, b) => {
                        // 1. Avoid Shinkan duty
                        const aHasShinkan = a.shinkanExclusions.has(date) ? 1 : 0;
                        const bHasShinkan = b.shinkanExclusions.has(date) ? 1 : 0;
                        if (aHasShinkan !== bHasShinkan) return aHasShinkan - bHasShinkan;
                        
                        // 2. Equalize shifts overall
                        const countDiff = counts[a.id].second - counts[b.id].second;
                        if (countDiff !== 0) return countDiff;

                        // 3. Prefer staff for 2nd call (staff > pgy23 > pgy1) if counts are equal
                        const weightDiff = roleWeight2nd[a.role] - roleWeight2nd[b.role];
                        if (weightDiff !== 0) return weightDiff;

                        // 4. Randomize
                        return Math.random() - 0.5;
                    });

                    let secondCall = avail2nd.length > 0 ? avail2nd[0] : null;
                    let isWarning = false;

                    if (secondCall) {
                        counts[secondCall.id].second++;
                        counts[secondCall.id].total++;
                        // Penalize if forced to assign to Shinkan person
                        if(secondCall.shinkanExclusions.has(date)) {
                            iterationScore -= 5000; 
                            isWarning = true;
                        }
                    } else {
                        iterationScore -= 100000;
                    }

                    currentSchedule.push({
                        date: date,
                        dayName: day.dayName,
                        first: firstCall ? firstCall.name : '割当不可',
                        second: secondCall ? secondCall.name : '割当不可',
                        isWarning: isWarning
                    });
                }

                // Evaluate Schedule Quality (Add penalty for unbalanced total shifts to encourage variety)
                let varianceTotal = Object.values(counts).reduce((sum, c) => sum + Math.pow(c.total, 2), 0);
                iterationScore -= varianceTotal * 20; 

                if (iterationScore > bestScore) {
                    bestScore = iterationScore;
                    bestSchedule = currentSchedule;
                }

                if(iterationScore === 0) break;
            }

            renderSchedule(bestSchedule);
        }

        function renderSchedule(schedule) {
            const tbody = document.getElementById('resultTable');
            tbody.innerHTML = '';

            if (!schedule || schedule.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-red-500 font-medium">条件が厳しすぎます。設定を見直してください。</td></tr>`;
                return;
            }

            schedule.forEach(day => {
                const tr = document.createElement('tr');
                
                let firstContent, firstClass;
                if (day.first === '割当不可') {
                    firstContent = `<i class="fa-solid fa-triangle-exclamation mr-1"></i>割当不可`;
                    firstClass = 'bg-red-100 text-red-700 font-bold border border-red-200';
                } else {
                    firstContent = day.first; // 属性は表示しない
                    firstClass = 'text-navy-900 font-medium';
                }

                let secondContent, secondClass;
                if (day.second === '割当不可') {
                    secondContent = `<i class="fa-solid fa-triangle-exclamation mr-1"></i>割当不可`;
                    secondClass = 'bg-red-100 text-red-700 font-bold border border-red-200';
                } else {
                    const warningIcon = day.isWarning ? `<i class="fa-solid fa-triangle-exclamation text-orange-500 mr-1.5" title="新患担当日ですが、やむを得ず2ndに割り当てられました"></i>` : '';
                    secondContent = `${warningIcon}${day.second}`; // 属性は表示しない
                    secondClass = 'text-gray-700';
                }

                tr.className = `transition hover:bg-navy-50/50 border-b border-gray-100`;
                tr.innerHTML = `
                    <td class="px-3 py-2 whitespace-nowrap text-gray-700 bg-gray-50/30">
                        <span class="font-bold text-base">${day.date}</span><span class="text-xs ml-1 text-gray-500">(${day.dayName})</span>
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap ${firstClass}">
                        ${firstContent}
                    </td>
                    <td class="px-3 py-2 whitespace-nowrap ${secondClass}">
                        ${secondContent}
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            renderSummary(schedule);
        }

        function renderSummary(schedule) {
            const shiftCounts = {};
            members.forEach(m => shiftCounts[m.name] = { first: 0, second: 0, total: 0 });

            schedule.forEach(day => {
                if (day.first !== '割当不可' && shiftCounts[day.first]) {
                    shiftCounts[day.first].first++;
                    shiftCounts[day.first].total++;
                }
                if (day.second !== '割当不可' && shiftCounts[day.second]) {
                    shiftCounts[day.second].second++;
                    shiftCounts[day.second].total++;
                }
            });

            const summaryContainer = document.getElementById('summaryContainer');
            
            let summaryHTML = `
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="bg-navy-800 px-5 py-3 text-white">
                        <h2 class="font-semibold text-sm"><i class="fa-solid fa-chart-pie mr-2"></i>担当回数サマリー</h2>
                    </div>
                    <div class="p-0 overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200 text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-2.5 text-left font-medium text-gray-500">名前</th>
                                    <th class="px-3 py-2.5 text-center font-medium text-gray-500">1st</th>
                                    <th class="px-3 py-2.5 text-center font-medium text-gray-500">2nd</th>
                                    <th class="px-3 py-2.5 text-center font-bold text-navy-800 bg-navy-50">計</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
            `;

            members.forEach(member => {
                const counts = shiftCounts[member.name];
                if(counts) {
                     summaryHTML += `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="px-4 py-2 text-gray-800 font-medium">${member.name}</td>
                            <td class="px-3 py-2 text-center text-gray-600">${counts.first}</td>
                            <td class="px-3 py-2 text-center text-gray-600">${counts.second}</td>
                            <td class="px-3 py-2 text-center font-bold text-navy-700 bg-navy-50/50">${counts.total}</td>
                        </tr>
                    `;
                }
            });

            summaryHTML += `
                            </tbody>
                        </table>
                    </div>
                </section>
            `;

            summaryContainer.innerHTML = summaryHTML;
        }

        function copyToClipboard() {
            const resultTable = document.getElementById('resultTable');
            if (resultTable.innerText.includes('条件を設定し')) {
                showAlert('コピーするスケジュールがありません。');
                return;
            }

            let text = '日付\t曜日\t1st Call\t2nd Call\n';
            const rows = resultTable.querySelectorAll('tr');
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if(cols.length === 3) {
                    let dateRaw = cols[0].innerText.replace(/\n/g, '').trim();
                    const dateMatch = dateRaw.match(/(\d+)\((.)\)/);
                    let dateNum = dateMatch ? dateMatch[1] : dateRaw;
                    let dayName = dateMatch ? dateMatch[2] : '';
                    
                    let first = cols[1].innerText.trim();
                    let second = cols[2].innerText.trim();
                    
                    first = first.replace(/<[^>]*>?/gm, '').replace('割当不可', '不可').trim(); 
                    second = second.replace(/<[^>]*>?/gm, '').replace('割当不可', '不可').trim(); 

                    text += `${dateNum}\t${dayName}\t${first}\t${second}\n`;
                }
            });

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showAlert('クリップボードにコピーしました！ (Excel等に貼り付け可能です)');
            } catch (err) {
                showAlert('コピーに失敗しました。');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
